name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write access is needed to push the built files to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Opt into Node.js 24 for the GitHub Actions runner environment so that
    # actions/checkout, actions/setup-node, etc. don't emit deprecation warnings.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LinkML
        run: pip install linkml

      # ── Redirect network imports to local DCAT-AP+ copy ─────────────────────
      # Several schema files import `dcatapplus:latest/schema/dcat_ap_plus` which
      # expands to https://w3id.org/nfdi-de/dcat-ap-plus/ (a 303 redirect).
      # CI has no network access for schema resolution, so we patch all affected
      # YAML files in-place to use the local copy at schemas/dcat_ap_plus/.
      # The checkout is ephemeral; these modifications are never committed.
      - name: Patch network imports → local DCAT-AP+ schema
        run: |
          find schemas -name "*.yaml" \
            -exec sed -i \
              's|dcatapplus:latest/schema/dcat_ap_plus|../../dcat_ap_plus/schema/dcat_ap_plus|g' \
              {} +
          echo "Patched files:"
          grep -rn "dcat_ap_plus" schemas --include="*.yaml" | grep "import\|  -" | head -20

      # ── Compile JSON schemas from LinkML YAML sources ───────────────────────
      - name: Compile chem-dcat-ap schema
        run: |
          gen-json-schema schemas/chem_dcat_ap/schema/chem_dcat_ap.yaml \
            > src/schema/dcat_4c_ap.schema.json

      - name: Compile CoreMeta4Cat schema
        run: |
          gen-json-schema schemas/coremeta4cat/schema/coremeta4cat.yaml \
            > src/schema/coremeta4cat.schema.json

      - name: Compile DCAT-AP+ schema
        run: |
          gen-json-schema schemas/dcat_ap_plus/schema/dcat_ap_plus.yaml \
            > src/schema/dcat_ap_plus.schema.json

      # ── Install JS dependencies ─────────────────────────────────────────────
      - run: npm ci

      # ── Build all three schema variants ─────────────────────────────────────
      - name: Build chem-dcat-ap
        run: VITE_SCHEMA=chemdcat npm run build:app

      - name: Build CoreMeta4Cat
        run: VITE_SCHEMA=coremeta4cat npm run build:app

      - name: Build DCAT-AP+
        run: VITE_SCHEMA=dcat-ap-plus npm run build:app

      # ── Copy static docs pages to dist/ root ───────────────────────────────
      - run: node scripts/copy-docs.mjs

      # ── Push dist/ to the gh-pages branch ──────────────────────────────────
      # This replaces the GitHub Actions artifact approach.
      # After this workflow runs, the gh-pages branch will contain the exact
      # files served by GitHub Pages — fully inspectable via GitHub Desktop,
      # git diff, or the GitHub web UI.
      #
      # ⚠️  Repository setting required (one-time, manual):
      #   Settings → Pages → Source → "Deploy from a branch"
      #   Branch: gh-pages  /  Folder: / (root)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true          # remove files deleted from dist on next deploy
          single-commit: true  # squash history so gh-pages stays lean
